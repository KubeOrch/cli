# Hybrid Core mode - Core repo cloned, UI from Docker image
# MongoDB and UI run in Docker; Core runs on the host.

name: ${KUBEORCH_COMPOSE_PROJECT:-kubeorchestra}

networks:
  kubeorchestra-net:
    driver: bridge
    name: kubeorchestra-network-hybrid

services:
  mongodb:
    image: mongo:8.0@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a
    container_name: kubeorchestra-mongodb-hybrid
    restart: unless-stopped
    networks:
      - kubeorchestra-net
    environment:
      MONGO_INITDB_DATABASE: kubeorchestra
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    image: ${KUBEORCH_UI_IMAGE:-ghcr.io/kubeorch/ui:v0.0.3@sha256:7ae131ccca459c582bfa14287bd53e1c74bd79f3b3015560ab6c45d8686839f3}
    container_name: kubeorchestra-ui-hybrid
    restart: unless-stopped
    networks:
      - kubeorchestra-net
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/v1/api

# Core runs on host: cd core && go run . (port 3000)
# Core connects to MongoDB at localhost:27017.

volumes:
  mongodb_data:
    name: kubeorchestra_mongodb_data_hybrid
  mongodb_config:
    name: kubeorchestra_mongodb_config_hybrid
